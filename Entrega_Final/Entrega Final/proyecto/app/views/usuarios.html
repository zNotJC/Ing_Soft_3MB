<div class="col-md-4"><label class="form-label" for="contrasena">Contraseña (mínimo 8 caracteres)</label><input class="form-control" id="contrasena" name="contrasena" type="password" minlength="8" required></div>
</div>
<div class="mt-3 d-flex gap-2"><button class="btn btn-primary" id="guardarUsuario" type="submit">Crear usuario</button><button class="btn btn-secondary" id="cancelarEdicionUsuario" type="button" hidden>Cancelar edición</button></div>

<p id="mensajeUsuarios" role="status" aria-live="polite"></p>
