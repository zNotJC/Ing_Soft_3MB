<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOJOLOS - Usuarios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/global.css"><style>body.auth-pendiente{visibility:hidden}</style></head>
<body class="auth-pendiente"><header id="appNavbar"></header><main class="container py-4"><h1>Administración de usuarios</h1><form id="formUsuario" class="card card-body mb-4" data-roles="Administrador"><div class="row g-3"><div class="col-md-3"><label class="form-label" for="cedula">Cédula</label><input class="form-control" id="cedula" name="cedula" pattern="[0-9]{8}" minlength="8" maxlength="8" required></div><div class="col-md-3"><label class="form-label" for="usuario">Usuario</label><input class="form-control" id="usuario" name="usuario" minlength="4" maxlength="20" pattern="[A-Za-z0-9]+" required></div><div class="col-md-3"><label class="form-label" for="correo">Correo</label><input class="form-control" id="correo" name="correo" type="email" maxlength="120" required></div><div class="col-md-3"><label class="form-label" for="rol">Rol</label><select class="form-select" id="rol" name="rol" required><option value="Docente">Docente</option><option value="Tecnico">Técnico</option><option value="Administrador">Administrador</option></select></div><div class="col-md-5"><label class="form-label" for="contrasena">Contraseña</label><div class="password-field"><input class="form-control" id="contrasena" name="contrasena" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo 8 caracteres"><button type="button" class="password-toggle" data-password-target="contrasena" aria-label="Mostrar contraseña" aria-pressed="false">◉</button></div><small id="ayudaContrasena" class="form-text">Al modificar, deja el campo vacío para conservar la contraseña actual.</small></div></div><div class="mt-3 d-flex gap-2"><button class="btn btn-primary" id="guardarUsuario" type="submit">Crear usuario</button><button class="btn btn-secondary" id="cancelarEdicionUsuario" type="button" hidden>Cancelar edición</button></div></form><p id="mensajeUsuarios" role="status" aria-live="polite"></p><div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>Cédula</th><th>Usuario</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tablaUsuarios"><tr><td colspan="6">Cargando usuarios...</td></tr></tbody></table></div></main><footer class="site-footer"><img class="footer-logo" src="../assets/img/jojolos-footer.svg" alt="JOJOLOS"><p data-i18n-es="JOJOLOS - Sistema de Gestión de Recursos y Soporte de Informática" data-i18n-en="JOJOLOS - IT Resources and Support Management System">JOJOLOS - Sistema de Gestión de Recursos y Soporte de Informática</p></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/js/preferencias.js"></script><script src="../assets/js/paginas.js" data-page-script="usuarios.js"></script><script src="../assets/js/password-toggle.js"></script></body></html>
