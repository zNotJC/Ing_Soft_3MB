<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      JOJOLOS - Inicio de Sesión
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/index.css">
  </head>
  <body>
    <div id="preferenciasLogin" class="preferencias-login" aria-label="Preferencias de accesibilidad">
      <button type="button" id="alternarIdioma" class="btn-preferencia" aria-label="Cambiar idioma">
        ES / EN
      </button>
      <button type="button" id="alternarTema" class="btn-preferencia" aria-label="Cambiar tema">
        Claro / Oscuro
      </button>
    </div>
    <header>
      <h1>
        JOJOLOS
      </h1>
      <p class="subtitulo-sistema" data-i18n-es="Sistema de Gestión de Recursos y Soporte de Informática" data-i18n-en="IT Resources and Support Management System">
        Sistema de Gestión de Recursos y Soporte de Informática
      </p>
    </header>
    <main>
      <section>
        <h2>
          Inicio de Sesión
        </h2>
        <div id="loginError" class="alert alert-danger" role="alert" hidden>
        </div>
        <form id="loginForm" action="index.php" method="POST">
          <label for="cedula">
            Cédula
          </label>
          <input type="text" id="cedula" name="cedula" required minlength="8" maxlength="8" pattern="[0-9]{8}">
          <label for="contrasena">
            Contraseña
          </label>
          <div class="password-field">
            <input type="password" id="contrasena" name="contrasena" required minlength="6" maxlength="100" autocomplete="current-password">
            <button type="button" class="password-toggle" data-password-target="contrasena" aria-label="Mostrar contraseña" aria-pressed="false">
              ◉
            </button>
          </div>
          <button type="submit">
            Ingresar
          </button>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <img class="footer-logo" src="assets/img/jojolos-footer.png" alt="JOJOLOS">
      <p data-i18n-es="JOJOLOS - Sistema de Gestión de Recursos y Soporte de Informática" data-i18n-en="JOJOLOS - IT Resources and Support Management System">
        JOJOLOS - Sistema de Gestión de Recursos y Soporte de Informática
      </p>
    </footer>
    <script src="assets/js/password-toggle.js">
    </script>
    <script src="assets/js/login.js">
    </script>
    <script src="assets/js/preferencias.js">
    </script>
  </body>
</html>
